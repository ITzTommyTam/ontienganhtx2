  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="Game bắn súng gõ từ vựng tiếng Anh Unit 2: A Multicultural World phong cách Nothing OS vũ trụ, tích hợp bảng xếp hạng thời gian thực, thách đấu bạn bè và ôn tập từ sai." />
    <meta property="og:title" content="ORBITAL // TYPE (Unit 2)" />
    <meta property="og:description" content="Game bắn súng gõ từ vựng tiếng Anh Unit 2: A Multicultural World phong cách Nothing OS vũ trụ, tích hợp bảng xếp hạng thời gian thực, thách đấu bạn bè và ôn tập từ sai." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=JetBrains+Mono:ital,wght@0,400..800;1,400..800&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  </head>
  <body style="background-color: #050505; color: #ffffff; margin: 0;">
    <div id="root"></div>
    <script>
      window.__loadGhPagesFallback = function () {
        if (window.__ghFallbackLoaded) return;
        var root = document.getElementById('root');
        if (root && root.children && root.children.length > 0) return;
        window.__ghFallbackLoaded = true;
        var css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = './public/gh-pages-bundle/app.css';
        css.onerror = function () {
          var altCss = document.createElement('link');
          altCss.rel = 'stylesheet';
          altCss.href = './gh-pages-bundle/app.css';
          document.head.appendChild(altCss);
        };
        document.head.appendChild(css);

        var s = document.createElement('script');
        s.type = 'module';
        s.src = './public/gh-pages-bundle/app.js';
        s.onerror = function () {
          var altS = document.createElement('script');
          altS.type = 'module';
          altS.src = './gh-pages-bundle/app.js';
          document.body.appendChild(altS);
        };
        document.body.appendChild(s);
      };
      setTimeout(function () {
        var root = document.getElementById('root');
        if (!root || !root.children || root.children.length === 0) {
          window.__loadGhPagesFallback();
        }
      }, 900);
    </script>
    <script type="module" src="./src/main.tsx" onerror="window.__loadGhPagesFallback && window.__loadGhPagesFallback()"></script>
  </body>
</html>
